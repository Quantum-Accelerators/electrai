# Benchmark config: extends ResUNet baseline with profiling settings
# Run with: uv run python src/electrai/scripts/benchmark.py --config src/electrai/configs/MP/config_benchmark.yaml

# Dataset / loader parameters
data:
  _target_: electrai.dataloader.dataset.RhoRead
  root: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/dataset_2/mp_filelist.txt
  split_file: null
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: false
  val_frac: 0.005
  drop_last: false
  augmentation: false
  random_seed: 42

# Model
model:
  _target_: electrai.model.resunet.ResUNet3D
  in_channels: 1
  out_channels: 1
  n_channels: 32
  n_residual_blocks: 1
  kernel_size: 5
  depth: 2

# Training parameters
precision: 32
epochs: 50
lr: 0.01
weight_decay: 0.0
warmup_length: 1
gradient_clip_value: 5.0
beta1: 0.9
beta2: 0.99

# Benchmark-specific settings
benchmark:
  warmup_steps: 5
  data_loading_steps: 100
  gpu_compute_steps: 50
  end_to_end_steps: 50
  output_file: benchmark_results.json
