# Stage C of the LR/WD width sweep (docs/lr_wd_width_sweep.md): full-scale
# confirmation at the tuned recipe. Identical to the incumbent production
# config INCLUDING the 100-epoch cosine -- only lr differs -- so val curves
# compare against the incumbent at matched epochs. Budget: halt manually
# around epoch 10-12 (do not set epochs lower: that would compress the
# cosine and flatter this run vs the incumbent).
data:
  _target_: electrai.dataloader.dataset.RhoRead
  datasets:
  - root: /uv/cache/electrai/mp/chg_datasets/functionals/gga/mp_filelist_capped.txt
    split_file: /uv/cache/electrai/mp/chg_datasets/functionals/gga/split_capped.json
    dataset_id: 1
  - root: /uv/cache/electrai/mp/chg_datasets/functionals/gga+u/mp_filelist_capped.txt
    split_file: /uv/cache/electrai/mp/chg_datasets/functionals/gga+u/split_capped.json
    dataset_id: 2
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: false
  drop_last: false
  augmentation: false
  random_seed: 42
model:
  _target_: electrai.model.resunet.ResUNet3D
  in_channels: 1
  out_channels: 1
  n_channels: 64
  n_residual_blocks: 1
  kernel_size: 5
  depth: 2
precision: bf16-mixed
epochs: 100
lr: 0.004
weight_decay: 0.0
warmup_length: 4
beta1: 0.9
beta2: 0.99
wandb_mode: offline
entity: PrinceOA
wb_pname: mp-gga-ggau-width
run_name: config_gga_gga+u_w64_lr4e-3
ckpt_path: /uv/cache/electrai/checkpoints/gga_gga+u_w64_lr4e-3
