# Width-96 point of the width ablation. IDENTICAL to config_gga_gga+u_w64.yaml
# (same capped GGA + GGA+U dataset/splits, bf16-mixed, lr 0.001, warmup 4) with
# a SINGLE delta so the only variable vs W64 is width:
#   - model.n_channels: 64 -> 96
# Compare against the W64 result on this exact dataset: val NMAE 0.84%
# (ckpt_epoch=16_val_loss=0.008398), W&B mp-gga-ggau-width run zz3oecp7.
#
# Memory: W96 activations ~1.5x W64 (~115 GB), which OOMs an 80 GB A100/H100.
# This run targets a GB200 (B200, 192 GB/GPU), so it fits WITHOUT activation
# checkpointing -> `use_checkpoint` stays off, matching W64 exactly. If ever run
# on 80 GB GPUs, set model.use_checkpoint: True (costs ~30% compute).
# Reuses the same *_capped filelists/splits as W64 (in s3://oa-electrai/...);
# do NOT re-cap, or the W64 comparison breaks.
# Tracked in W&B project `mp-gga-ggau-width`.

# Dataset / loader parameters
data:
  _target_: electrai.dataloader.dataset.RhoRead
  datasets:
    - root: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/chg_datasets/functionals/gga/mp_filelist_capped.txt
      split_file: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/chg_datasets/functionals/gga/split_capped.json
      dataset_id: 1
    - root: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/chg_datasets/functionals/gga+u/mp_filelist_capped.txt
      split_file: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/chg_datasets/functionals/gga+u/split_capped.json
      dataset_id: 2
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: false
  drop_last: false
  augmentation: false
  random_seed: 42

# Model
model:
  _target_: electrai.model.resunet.ResUNet3D
  in_channels: 1
  out_channels: 1
  n_channels: 96
  n_residual_blocks: 1
  kernel_size: 5
  depth: 2

# Training parameters
precision: bf16-mixed
epochs: 100
lr: 0.001
weight_decay: 0.0
warmup_length: 4
beta1: 0.9
beta2: 0.99

# Weights and biases
wandb_mode: online
entity: PrinceOA
wb_pname: mp-gga-ggau-width
run_name: gga_gga+u_w96

# checkpoints (overridden by scripts/lambda/run_training.sh to $CKPT_ROOT/<mode>_<run>)
ckpt_path: ./checkpoints/gga_gga+u_w96

# set HF as well
