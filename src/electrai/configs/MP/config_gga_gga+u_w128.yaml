# Width-128 point of the width ablation. IDENTICAL to config_gga_gga+u_w96.yaml
# (same capped GGA + GGA+U dataset/splits, bf16-mixed, lr 0.001, warmup 4) with
# a SINGLE delta so the only variable vs W96 is width:
#   - model.n_channels: 96 -> 128
# Compare against W96 on this exact dataset (W&B mp-gga-ggau-width run
# `revived-energy-7`/z21di7sl lineage: val_loss 0.007929 at epoch 12) and W64
# (best 0.008398 at epoch 16, run zz3oecp7).
#
# Memory: ~193M params; activations ~4/3 of W96's measured 28.2 GiB peak at the
# 180^3 cap -> ~40-45 GiB expected, no activation checkpointing needed on
# GB200 (185 GiB). Verify with scripts/coreweave/dry_run.py before launch.
# Compute: conv FLOPs ~(128/96)^2 = 1.78x W96 per step; wall-clock increase is
# smaller because larger channel counts improve GPU occupancy (W96 MFU ~10%).
# Reuses the same *_capped filelists/splits as W64/W96; do NOT re-cap.
#
# Paths target the CoreWeave marin-us-east-08a cluster: dataset staged from the
# rhoarnet-us-east-08a CAIOS bucket to node-local NVMe by
# scripts/coreweave/stage_data.sh (run before training; run_training.sh does).
# Tracked in W&B project `mp-gga-ggau-width`.

# Dataset / loader parameters
data:
  _target_: electrai.dataloader.dataset.RhoRead
  datasets:
    - root: /uv/cache/electrai/mp/chg_datasets/functionals/gga/mp_filelist_capped.txt
      split_file: /uv/cache/electrai/mp/chg_datasets/functionals/gga/split_capped.json
      dataset_id: 1
    - root: /uv/cache/electrai/mp/chg_datasets/functionals/gga+u/mp_filelist_capped.txt
      split_file: /uv/cache/electrai/mp/chg_datasets/functionals/gga+u/split_capped.json
      dataset_id: 2
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: false
  drop_last: false
  augmentation: false
  random_seed: 42

# Model
model:
  _target_: electrai.model.resunet.ResUNet3D
  in_channels: 1
  out_channels: 1
  n_channels: 128
  n_residual_blocks: 1
  kernel_size: 5
  depth: 2

# Training parameters
precision: bf16-mixed
epochs: 100
lr: 0.001
weight_decay: 0.0
warmup_length: 4
beta1: 0.9
beta2: 0.99

# Weights and biases — OFFLINE + sidecar sync: online wandb.init crashes with
# the viewer flags=null TypeError and a rank-0 death silently deadlocks DDP.
# run_training.sh re-syncs the offline run dirs every CKPT_SYNC_S seconds.
wandb_mode: offline
entity: PrinceOA
wb_pname: mp-gga-ggau-width
run_name: gga_gga+u_w128

# checkpoints: node-local NVMe (survives same-node pod restarts); synced to and
# restored from the CAIOS bucket by run_training.sh (path derived from this
# config's filename stem — keep them consistent)
ckpt_path: /uv/cache/electrai/checkpoints/gga_gga+u_w128
