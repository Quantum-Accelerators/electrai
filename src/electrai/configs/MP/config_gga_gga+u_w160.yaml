# Width-160 point of the width ablation. Same recipe as W96/W128 (capped
# GGA + GGA+U dataset/splits, bf16-mixed, lr 0.001, warmup 4) with a SINGLE
# delta: model.n_channels -> 160 (~302M params). This is the WIDEST width
# that clears the cuDNN large-tensor kernel cliff on the UNMODIFIED capped
# dataset (measured 2026-07-22: W160@180^3 = 2.36s/step, 48.3 GiB peak;
# W176@180^3 = 590s/step — cliff between 1.87e9 and 2.05e9 concat elements).
# Full comparability with W64/W96/W128: same filelists, do NOT re-cap.
# Est ~8.5-9h/epoch on 4x GB200 (~7 days to a W96-style plateau).
# lr 0.001 / warmup 4 kept for single-variable comparability; note the
# optimizer regime is increasingly untuned at this scale.
# Tracked in W&B project `mp-gga-ggau-width`.
# Dataset / loader parameters
data:
  _target_: electrai.dataloader.dataset.RhoRead
  datasets:
    - root: /uv/cache/electrai/mp/chg_datasets/functionals/gga/mp_filelist_capped.txt
      split_file: /uv/cache/electrai/mp/chg_datasets/functionals/gga/split_capped.json
      dataset_id: 1
    - root: /uv/cache/electrai/mp/chg_datasets/functionals/gga+u/mp_filelist_capped.txt
      split_file: /uv/cache/electrai/mp/chg_datasets/functionals/gga+u/split_capped.json
      dataset_id: 2
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: false
  drop_last: false
  augmentation: false
  random_seed: 42

# Model
model:
  _target_: electrai.model.resunet.ResUNet3D
  in_channels: 1
  out_channels: 1
  n_channels: 160
  n_residual_blocks: 1
  kernel_size: 5
  depth: 2

# Training parameters
precision: bf16-mixed
epochs: 100
lr: 0.001
weight_decay: 0.0
warmup_length: 4
beta1: 0.9
beta2: 0.99

# Weights and biases — OFFLINE + sidecar sync: online wandb.init crashes with
# the viewer flags=null TypeError and a rank-0 death silently deadlocks DDP.
# run_training.sh re-syncs the offline run dirs every CKPT_SYNC_S seconds.
wandb_mode: offline
entity: PrinceOA
wb_pname: mp-gga-ggau-width
run_name: gga_gga+u_w160

# checkpoints: node-local NVMe (survives same-node pod restarts); synced to and
# restored from the CAIOS bucket by run_training.sh (path derived from this
# config's filename stem — keep them consistent)
ckpt_path: /uv/cache/electrai/checkpoints/gga_gga+u_w160
