# Smoke test for config_gga_gga+u_f32 on Modal: subset filelists + few epochs.
# Validates data wiring, DDP/checkpoint path, and wandb logging before the full run.
#
# Create the subset filelists on the Volume first (after the Globus transfer):
#   modal run modal/prep_volume.py        # also (re)links data/label, commits the Volume
#
# Paths are already in Volume (/data) form, so train.py's della->Volume remap is a no-op.

# Dataset / loader parameters
data:
  _target_: electrai.dataloader.dataset.RhoRead
  datasets:
    - root: /data/mp/chg_datasets/functionals/gga/mp_filelist_smoke.txt
      split_file: null
      val_frac: 0.1
      dataset_id: 1
    - root: /data/mp/chg_datasets/functionals/gga+u/mp_filelist_smoke.txt
      split_file: null
      val_frac: 0.1
      dataset_id: 2
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: false
  drop_last: false
  augmentation: false
  random_seed: 42

# Model
model:
  _target_: electrai.model.resunet.ResUNet3D
  in_channels: 1
  out_channels: 1
  n_channels: 32
  n_residual_blocks: 1
  kernel_size: 5
  depth: 2

# Training parameters
precision: 32
epochs: 2
lr: 0.001
weight_decay: 0.0
warmup_length: 1
beta1: 0.9
beta2: 0.99

# Weights and biases
wandb_mode: online
entity: PrinceOA
wb_pname: mp-large-scale
run_name: gga_gga+u_f32_smoke

# checkpoints (overridden by modal/train.py to /checkpoints/<run_name>)
ckpt_path: /checkpoints/gga_gga+u_f32_smoke
