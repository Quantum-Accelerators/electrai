# Dataset / loader parameters
data:
  _target_: electrai.dataloader.dataset.RhoRead
  datasets:
    - root: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/chg_datasets/functionals/gga/mp_filelist.txt
      split_file: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/chg_datasets/functionals/gga/split.json
      dataset_id: 1
    - root: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/chg_datasets/functionals/gga+u/mp_filelist.txt
      split_file: /scratch/gpfs/ROSENGROUP/common/globus_share_OA/mp/chg_datasets/functionals/gga+u/split.json
      dataset_id: 2
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: false
  drop_last: false
  augmentation: false
  random_seed: 42

# Model
model:
  _target_: electrai.model.resunet.ResUNet3D
  in_channels: 1
  out_channels: 1
  n_channels: 32
  n_residual_blocks: 1
  kernel_size: 5
  depth: 2

# Training parameters
precision: 32
epochs: 100
lr: 0.001
weight_decay: 0.0
warmup_length: 1
beta1: 0.9
beta2: 0.99

# Weights and biases
wandb_mode: online
entity: PrinceOA
wb_pname: mp-large-scale
run_name: gga_gga+u_f32

# checkpoints
ckpt_path: /scratch/gpfs/ROSENGROUP/ho0950/electrai/examples/MP/experiments/chgcar/functionals/gga_gga+u_f32/checkpoints

# set HF as well
