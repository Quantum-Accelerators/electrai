# W128 at the sweep-tuned lr 2e-3 (vs the live 1e-3 run, W&B mp-gga-ggau-width).
# Logs to its OWN W&B project so the two W128 runs stay separate. Same
# 100-epoch cosine and capped dataset as the incumbent -> matched-epoch
# comparison against gga_gga+u_w128 tells us what 1e-3 left on the table.
data:
  _target_: electrai.dataloader.dataset.RhoRead
  datasets:
  - root: /uv/cache/electrai/mp/chg_datasets/functionals/gga/mp_filelist_capped.txt
    split_file: /uv/cache/electrai/mp/chg_datasets/functionals/gga/split_capped.json
    dataset_id: 1
  - root: /uv/cache/electrai/mp/chg_datasets/functionals/gga+u/mp_filelist_capped.txt
    split_file: /uv/cache/electrai/mp/chg_datasets/functionals/gga+u/split_capped.json
    dataset_id: 2
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: false
  drop_last: false
  augmentation: false
  random_seed: 42
model:
  _target_: electrai.model.resunet.ResUNet3D
  in_channels: 1
  out_channels: 1
  n_channels: 128
  n_residual_blocks: 1
  kernel_size: 5
  depth: 2
precision: bf16-mixed
epochs: 100
lr: 0.002
weight_decay: 0.0
warmup_length: 4
beta1: 0.9
beta2: 0.99
wandb_mode: offline
entity: PrinceOA
wb_pname: mp-gga-ggau-w128-lr2e3
run_name: config_gga_gga+u_w128_lr2e-3
ckpt_path: /uv/cache/electrai/checkpoints/config_gga_gga+u_w128_lr2e-3
