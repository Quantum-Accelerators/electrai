<svg width="400" height="440" viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle - warm gold for Elvis/viz theme -->
  <circle cx="200" cy="190" r="170" fill="#fff8e8" stroke="#d4a017" stroke-width="4"/>

  <defs>
    <linearGradient id="ev-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#5b4a9e"/>
    </linearGradient>
    <linearGradient id="ev-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8f0e8"/>
      <stop offset="100%" stop-color="#7ecfc0"/>
    </linearGradient>
    <linearGradient id="ev-shades" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#2d2d4e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="ev-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ev-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>

  <!-- Hair back -->
  <path d="M150 180 Q130 120 155 75 Q180 35 220 40 Q260 45 275 85 Q285 115 275 160 Q270 200 260 230 Q250 260 235 280"
        fill="url(#ev-hair)" stroke="#1a1040" stroke-width="2.5"/>

  <!-- Head -->
  <ellipse cx="200" cy="170" rx="60" ry="72" fill="url(#ev-skin)" stroke="#4a8a7a" stroke-width="2.5"/>

  <!-- Pointed ear -->
  <path d="M258 155 Q285 130 300 110 Q290 145 265 165"
        fill="url(#ev-skin)" stroke="#4a8a7a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Elvis pompadour - big swooping hair -->
  <path d="M142 155 Q130 110 140 70 Q150 35 180 25 Q200 18 220 22 Q245 28 258 50 Q268 70 272 100
           Q265 75 250 58 Q235 45 215 40 Q190 37 170 48 Q152 62 148 90 Q145 120 155 155"
        fill="url(#ev-hair)" stroke="#1a1040" stroke-width="2"/>
  <!-- Pompadour volume/swoop -->
  <path d="M155 80 Q148 55 160 38 Q175 22 195 20 Q175 30 163 48 Q155 65 158 85"
        fill="#3d2b7a" stroke="none" opacity="0.5"/>

  <!-- Sunglasses -->
  <g>
    <!-- Bridge -->
    <path d="M185 155 L215 155" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
    <!-- Left lens frame -->
    <ellipse cx="175" cy="157" rx="18" ry="14" fill="url(#ev-shades)" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Left lens shine -->
    <ellipse cx="175" cy="157" rx="16" ry="12" fill="url(#ev-lens)"/>
    <!-- Right lens frame -->
    <ellipse cx="225" cy="157" rx="18" ry="14" fill="url(#ev-shades)" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Right lens shine -->
    <ellipse cx="225" cy="157" rx="16" ry="12" fill="url(#ev-lens)"/>
    <!-- Temple arm to ear -->
    <path d="M243 155 L265 150" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Circuit traces (same as elf-net, shared identity) -->
  <g stroke="#6c5ce7" stroke-width="1.8" fill="none" opacity="0.6">
    <path d="M175 195 L175 215 L185 225"/>
    <circle cx="175" cy="195" r="2.5" fill="#6c5ce7"/>
    <circle cx="185" cy="225" r="2.5" fill="#6c5ce7"/>
    <path d="M215 200 L225 210 L225 230"/>
    <circle cx="215" cy="200" r="2.5" fill="#6c5ce7"/>
    <circle cx="225" cy="230" r="2.5" fill="#6c5ce7"/>
  </g>

  <!-- Confident smirk -->
  <path d="M182 192 Q200 204 218 194" fill="none" stroke="#2d3436" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small leaf (still has nature element, but more subtle) -->
  <g>
    <path d="M232 48 Q240 30 245 18" fill="none" stroke="#2d8a6e" stroke-width="2" stroke-linecap="round"/>
    <path d="M245 18 Q260 12 262 22 Q254 18 245 18" fill="url(#ev-leaf)" stroke="#2d8a6e" stroke-width="1.5"/>
    <path d="M238 32 Q250 24 252 34 Q246 30 238 32" fill="#55efc4" stroke="#2d8a6e" stroke-width="1.5"/>
  </g>

  <!-- Neck/shoulders -->
  <path d="M175 238 Q180 260 170 280 Q160 295 140 300"
        fill="none" stroke="url(#ev-skin)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M225 238 Q220 260 230 280 Q240 295 260 300"
        fill="none" stroke="url(#ev-skin)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Sparkle/star near glasses (viz/showmanship) -->
  <g fill="#ffd700" opacity="0.8">
    <path d="M280 130 L283 138 L290 138 L284 143 L287 150 L280 146 L273 150 L276 143 L270 138 L277 138 Z"/>
  </g>

  <!-- Text -->
  <text x="200" y="410" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="38" font-weight="bold" text-anchor="middle" fill="#8a6d00" letter-spacing="3">ELF-VIZ</text>
</svg>
