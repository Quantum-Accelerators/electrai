name: Deploy to GitHub Pages

on:
  push:
    branches: [elvis]
    paths: [elvis/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: elvis/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: elvis
      - run: pnpm build
        working-directory: elvis
        env:
          BASE_PATH: /electrai/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: elvis/pkgs/static/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
