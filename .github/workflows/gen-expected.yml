name: Generate Expected Values

on:
  workflow_dispatch:
  push:
    branches: [gen-expected]

permissions:
  contents: read

jobs:
  gen-macos-arm64:
    runs-on: macos-latest  # Apple Silicon (arm64) as of late 2024
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate expected values (darwin-arm64)
        run: uv run python tests/e2e_train.py --update-expected --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: expected-darwin-arm64
          path: tests/expected_values.json

  gen-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate expected values (linux)
        run: uv run python tests/e2e_train.py --update-expected --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: expected-linux
          path: tests/expected_values.json

  merge:
    needs: [gen-macos-arm64, gen-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download darwin-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: expected-darwin-arm64
          path: tmp/darwin-arm64

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: expected-linux
          path: tmp/linux

      - name: Merge expected values
        run: |
          # Each artifact has expected_values.json with only that platform's values
          # Merge them into a single file
          python3 << 'EOF'
          import json

          darwin_arm64 = json.load(open('tmp/darwin-arm64/expected_values.json'))
          linux = json.load(open('tmp/linux/expected_values.json'))

          merged = {
              "darwin-arm64": darwin_arm64.get("darwin-arm64"),
              "linux": linux.get("linux"),
          }

          with open('expected_values.json', 'w') as f:
              json.dump(merged, f, indent=2)
              f.write('\n')

          print("Merged expected values:")
          print(json.dumps(merged, indent=2))
          EOF

      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: expected-values
          path: expected_values.json
