name: GPU Benchmark (Modal)

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: 'GPU spec (L4, A100, A100:2 for 2×A100, H100:4, etc.)'
        default: 'L4'
        type: string
      epochs:
        description: 'Number of training epochs'
        default: '5'
        type: string
      channels:
        description: 'Number of model channels (8=tiny, 32=prod, 64=large)'
        default: '32'
        type: string
      residual_blocks:
        description: 'Number of residual blocks (1=Betsy, 2=tiny, 16=prod)'
        default: '16'
        type: string
      depth:
        description: 'Model depth (encoder/decoder levels)'
        default: '2'
        type: string
      kernel_size:
        description: 'Convolution kernel size (3=default, 5=Betsy)'
        default: '3'
        type: string
      lr:
        description: 'Learning rate'
        default: '0.001'
        type: string
      val_frac:
        description: 'Validation fraction (0.005=Betsy, 0.4=benchmark default)'
        default: '0.4'
        type: string
      samples:
        description: 'Number of samples (0=all eligible)'
        default: '50'
        type: string
      dataset:
        description: 'Dataset: s3 (205 samples, matches EC2) or dataset_4 (2885 samples)'
        default: 's3'
        type: string
      wandb_project:
        description: 'WandB project name'
        default: 'elf-net-ci'
        type: string
      gradient_checkpoint:
        description: 'Enable gradient checkpointing (saves VRAM, ~2x slower)'
        default: 'true'
        type: string
      local_copy:
        description: 'Copy data to local SSD before training (slower start, faster I/O)'
        default: 'false'
        type: string
      run_name:
        description: 'WandB run name (auto-generated if empty)'
        default: ''
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: uv pip install --system modal

      - name: Run benchmark
        id: bench
        env:
          GPU: ${{ inputs.gpu || 'L4' }}
          MODAL_GPU: ${{ inputs.gpu || 'L4' }}
          EPOCHS: ${{ inputs.epochs || '5' }}
          CHANNELS: ${{ inputs.channels || '32' }}
          RESIDUAL_BLOCKS: ${{ inputs.residual_blocks || '16' }}
          DEPTH: ${{ inputs.depth || '2' }}
          KERNEL_SIZE: ${{ inputs.kernel_size || '3' }}
          LR: ${{ inputs.lr || '0.001' }}
          VAL_FRAC: ${{ inputs.val_frac || '0.4' }}
          SAMPLES: ${{ inputs.samples || '50' }}
          DATASET: ${{ inputs.dataset || 's3' }}
          WANDB_PROJECT: ${{ inputs.wandb_project || 'elf-net-ci' }}
          RUN_NAME: ${{ inputs.run_name }}
          GRAD_CKPT: ${{ inputs.gradient_checkpoint == 'true' && '--gradient-checkpoint' || '--no-gradient-checkpoint' }}
          LOCAL_COPY: ${{ inputs.local_copy == 'true' && '--local-copy' || '--no-local-copy' }}
        run: |
          OUTPUT=$(modal run modal/benchmark.py \
            --gpu "$GPU" \
            --epochs "$EPOCHS" \
            --channels "$CHANNELS" \
            --residual-blocks "$RESIDUAL_BLOCKS" \
            --depth "$DEPTH" \
            --kernel-size "$KERNEL_SIZE" \
            --lr "$LR" \
            --val-frac "$VAL_FRAC" \
            --samples "$SAMPLES" \
            --dataset "$DATASET" \
            --wandb-project "$WANDB_PROJECT" \
            $GRAD_CKPT \
            $LOCAL_COPY \
            ${RUN_NAME:+--run-name "$RUN_NAME"} 2>&1 | tee /dev/stderr)

          # Parse metrics from output
          for key in VAL_LOSS TRAIN_LOSS WALLCLOCK GPU DATASET SAMPLES WANDB_URL; do
            val=$(echo "$OUTPUT" | grep -oP "BENCHMARK_${key}=\K.*" || true)
            if [ -n "$val" ]; then
              echo "BENCHMARK_${key}=${val}" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Summary
        env:
          PLATFORM: "Modal (${{ inputs.gpu || 'L4' }})"
          EPOCHS: ${{ inputs.epochs || '5' }}
          CHANNELS: ${{ inputs.channels || '32' }}
          RESIDUAL_BLOCKS: ${{ inputs.residual_blocks || '16' }}
          DATA_DESC: "${{ inputs.dataset || 's3' }} (${{ inputs.samples || '50' }} samples)"
          VAL_LOSS: ${{ steps.bench.outputs.BENCHMARK_VAL_LOSS }}
          TRAIN_LOSS: ${{ steps.bench.outputs.BENCHMARK_TRAIN_LOSS }}
          WALLCLOCK: ${{ steps.bench.outputs.BENCHMARK_WALLCLOCK }}
          WANDB_RUN_URL: ${{ steps.bench.outputs.BENCHMARK_WANDB_URL }}
          WANDB_PROJECT: ${{ inputs.wandb_project || 'elf-net-ci' }}
        run: scripts/benchmark_summary.sh
